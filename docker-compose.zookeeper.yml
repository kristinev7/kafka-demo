services:
  # ---------- Backend (ZooKeeper profile) ----------
  backend-zk:
    profiles: ["zookeeper"]
    build: .
    ports:
      - "8080:8080"
    environment:
      # internal listener (see below)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-zk:29092
    depends_on:
      - kafka-zk

  # ---------- ZooKeeper (legacy) ----------
  zookeeper:
    profiles: ["zookeeper"]
    image: confluentinc/cp-zookeeper:7.5.3
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ---------- Kafka (ZooKeeper mode) ----------
  kafka-zk:
    profiles: ["zookeeper"]
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      # host access (optional but nice)
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Two listeners:
      # - 29092 for other containers (backend)
      # - 9092 for your host machine (optional)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-zk:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-broker dev settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
